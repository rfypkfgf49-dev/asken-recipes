<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ささみのスパイシーカレー漬け</title><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"ささみのスパイシーカレー漬け","recipeYield":"1人前（ささみ5本）","recipeIngredient":["鶏ささみ 300g","カレー粉 2g","ガラムマサラ 1g","おろしにんにく 2g","オリーブ油 4g","黒こしょう 0.3g","チリペッパー 0.5g"],"recipeInstructions":[{"@type":"HowToStep","text":"ささみの筋を取り、材料をすべて保存袋に入れて揉み込み、冷蔵庫で漬ける。"},{"@type":"HowToStep","text":"レンジグリルに重ならないよう並べ、600Wで5分加熱する。裏返してさらに約4分加熱し、中心温度75℃で1分以上を目安に十分火を通す。"}]}</script></head><body><main><h1>ささみのスパイシーカレー漬け</h1><p>1人前：ささみ5本（約300g）。塩を追加しないスパイス漬け。</p><ul><li>鶏ささみ 300g</li><li>カレー粉 2g（小さじ1）</li><li>ガラムマサラ 1g（小さじ1/2）</li><li>おろしにんにく 2g</li><li>オリーブ油 4g（小さじ1）</li><li>黒こしょう 0.3g</li><li>チリペッパー 0.5g（小さじ約1/3）</li></ul><p>保存袋で揉み込み冷蔵で漬ける。レンジグリルで600W 5分、裏返して約4分。肉の厚さ・量に応じて調整し中心まで十分に加熱する。漬けダレを捨てた場合の摂取栄養量は使用量・付着量によって変わる。</p></main></body></html>
